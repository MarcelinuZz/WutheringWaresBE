services:
  mysql:
    image: mysql:8.0
    container_name: mhslab-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: 'wuthering_wares'
    volumes:
      - ./wuthering_wares.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway-service:
    build: ./gateway-services
    container_name: mhslab-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: wuthering_wares
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      ITEM_SERVICE_URL: http://item-service:3005
      ORDER_SERVICE_URL: http://order-service:3006
    env_file:
      - path: ./gateway-services/.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      item-service:
        condition: service_started
      order-service:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./gateway-services
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./gateway-services/package.json

  auth-service:
    build: ./auth-services
    container_name: mhslab-auth
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: wuthering_wares
      TOKEN_SERVICE_URL: http://token-service:3004
      EMAIL_SERVICE_URL: http://email-service:3003
      GOOGLE_BIND_CALLBACK_URL: http://localhost:3000/api/auth/bind/google/callback
      DISCORD_BIND_CALLBACK_URL: http://localhost:3000/api/auth/bind/discord/callback
      AUTH_CODE_REDIRECT_URL: http://localhost:8080/auth/success
      BIND_CODE_REDIRECT_URL: http://localhost:8080/bind/success
    env_file:
      - path: ./auth-services/.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      token-service:
        condition: service_started
      email-service:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./auth-services
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./auth-services/package.json

  user-service:
    build: ./user-services
    container_name: mhslab-user
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: wuthering_wares
      TOKEN_SERVICE_URL: http://token-service:3004
    env_file:
      - path: ./user-services/.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      token-service:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./user-services
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./user-services/package.json

  email-service:
    build: ./email-services
    container_name: mhslab-email
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
    env_file:
      - path: ./email-services/.env
        required: false
    develop:
      watch:
        - action: sync
          path: ./email-services
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./email-services/package.json

  token-service:
    build: ./token-services
    container_name: mhslab-token
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: wuthering_wares
    env_file:
      - path: ./token-services/.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./token-services
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./token-services/package.json

  item-service:
    build: ./item-services
    container_name: mhslab-item
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: wuthering_wares
      TOKEN_SERVICE_URL: http://token-service:3004
      USER_SERVICE_URL: http://user-service:3002
    env_file:
      - path: ./item-services/.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      token-service:
        condition: service_started
      user-service:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./item-services
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./item-services/package.json

  order-service:
    build: ./order-services
    container_name: mhslab-order
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: wuthering_wares
      TOKEN_SERVICE_URL: http://token-service:3004
      ITEM_SERVICE_URL: http://item-service:3005
    env_file:
      - path: ./order-services/.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      token-service:
        condition: service_started
      item-service:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./order-services
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./order-services/package.json

volumes:
  mysql_data:
